services:
  postgres:
    image: postgres:16
    container_name: oktaia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oktaia
      POSTGRES_USER: oktaia
      POSTGRES_PASSWORD: oktaia_dev
    ports:
      - "5435:5432"
    volumes:
      - oktaia-postgres-data:/var/lib/postgresql/data

volumes:
  oktaia-postgres-data:
